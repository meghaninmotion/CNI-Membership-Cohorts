<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNI Membership Cohort Tenure</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a18;
    --ink-secondary: #5a5a54;
    --ink-tertiary: #9a9a90;
    --paper: #f7f5f0;
    --paper-warm: #ede9e0;
    --rule: #d8d4c8;
    --green-active: #1D9E75;
    --green-light: #e1f5ee;
    --gray-disc: #b4b2a9;
    --gray-disc-light: #e8e6e0;
    --gold-unknown: #C0DD97;
    --gold-unknown-border: #3B6D11;
    --accent: #1D9E75;
    --tab-active-bg: #1a1a18;
    --tab-active-text: #f7f5f0;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 48px 32px 64px;
  }

  header {
    max-width: 820px;
    margin: 0 auto 40px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 28px;
  }

  header p.eyebrow {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-tertiary);
    margin-bottom: 10px;
  }

  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    font-weight: 400;
    line-height: 1.25;
    color: var(--ink);
    margin-bottom: 10px;
  }

  header p.subtitle {
    font-size: 14px;
    color: var(--ink-secondary);
    line-height: 1.6;
    max-width: 560px;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
  }

  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--rule);
  }

  .tab-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    padding: 12px 24px;
    border: none;
    background: transparent;
    color: var(--ink-secondary);
    cursor: pointer;
    position: relative;
    transition: color 0.2s;
  }

  .tab-btn::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    right: 0;
    height: 2px;
    background: var(--ink);
    transform: scaleX(0);
    transition: transform 0.2s ease;
  }

  .tab-btn:hover { color: var(--ink); }

  .tab-btn.active {
    color: var(--ink);
  }

  .tab-btn.active::after {
    transform: scaleX(1);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .chart-area {
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .axis-row {
    display: flex;
    margin-left: 240px;
    margin-bottom: 10px;
    position: relative;
    height: 20px;
  }

  .axis-tick {
    position: absolute;
    font-size: 10px;
    color: var(--ink-tertiary);
    transform: translateX(-50%);
    letter-spacing: 0.02em;
  }

  .axis-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--rule);
  }

  .org-row {
    display: flex;
    align-items: center;
    margin-bottom: 7px;
    opacity: 0;
    animation: rowIn 0.3s ease forwards;
  }

  @keyframes rowIn {
    from { opacity: 0; transform: translateX(-6px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .org-name {
    width: 232px;
    min-width: 232px;
    font-size: 12px;
    color: var(--ink);
    text-align: right;
    padding-right: 12px;
    line-height: 1.35;
    font-weight: 300;
  }

  .bar-track {
    flex: 1;
    height: 20px;
    display: flex;
    border-radius: 2px;
    overflow: hidden;
    background: var(--paper-warm);
  }

  .seg-active {
    background: var(--green-active);
    height: 100%;
    transition: width 0.6s ease;
  }

  .seg-inactive {
    background: var(--gray-disc);
    height: 100%;
  }

  .seg-unknown {
    background: var(--gold-unknown);
    height: 100%;
    border-right: 2px dashed var(--gold-unknown-border);
  }

  .tenure-label {
    font-size: 11px;
    color: var(--ink-tertiary);
    margin-left: 9px;
    white-space: nowrap;
    min-width: 52px;
    font-weight: 400;
  }

  .section-divider {
    margin: 18px 0 14px 232px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-divider span {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-tertiary);
    white-space: nowrap;
    font-weight: 500;
  }

  .section-divider::before {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rule);
    display: none;
  }

  .section-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--rule);
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin: 24px 0 0 232px;
    padding-top: 20px;
    border-top: 1px solid var(--rule);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--ink-secondary);
  }

  .leg-swatch {
    width: 24px;
    height: 10px;
    border-radius: 1px;
    flex-shrink: 0;
  }

  .scale-note {
    margin: 10px 0 0 232px;
    font-size: 11px;
    color: var(--ink-tertiary);
  }

  .cohort-summary {
    margin: 0 0 28px 232px;
    display: flex;
    gap: 28px;
  }

  .summary-stat {
    display: flex;
    flex-direction: column;
  }

  .summary-num {
    font-family: 'DM Serif Display', serif;
    font-size: 26px;
    color: var(--ink);
    line-height: 1;
    margin-bottom: 3px;
  }

  .summary-label {
    font-size: 11px;
    color: var(--ink-tertiary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
  }

  .summary-divider {
    width: 1px;
    background: var(--rule);
    align-self: stretch;
  }
</style>
</head>
<body>

<header>
  <p class="eyebrow">Coalition for Networked Information</p>
  <h1>Membership Cohort Tenure</h1>
  <p class="subtitle">Organizations joining in the same year, viewed as a cohort. Each bar reflects the duration of an organization's membership from their join date.</p>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('1999', this)">1999 Cohort</button>
    <button class="tab-btn" onclick="switchTab('2012', this)">2012 Cohort</button>
    <button class="tab-btn" onclick="switchTab('2018', this)">2018 Cohort</button>
  </div>

  <div id="panel-1999" class="tab-panel active">
    <div class="chart-area" id="chart-1999"></div>
  </div>

  <div id="panel-2012" class="tab-panel">
    <div class="chart-area" id="chart-2012"></div>
  </div>

  <div id="panel-2018" class="tab-panel">
    <div class="chart-area" id="chart-2018"></div>
  </div>
</div>

<script>
const data = {
  '1999': {
    maxYears: 27,
    scaleNote: 'Scale: 27 years (1999–2026)',
    axisTicks: [0, 5, 10, 15, 20, 25, 27],
    active: [
      "National library association",
      "Public R1 university (Southeast) A",
      "Private research institute of technology (West)",
      "Nonprofit higher ed research organization",
      "Public R1 university (Midwest)",
      "Public R1 university (Pacific Northwest)",
      "Private R1 university (Northeast)",
      "Public R1 university (Southeast) B",
    ].map(name => ({ name, tenure: 27, status: 'active' })),
    discontinued: [
      { name: "International internet policy nonprofit", tenure: 15.2 },
      { name: "Federal government research library", tenure: 12.8 },
      { name: "Private philanthropic foundation", tenure: 7.6 },
      { name: "Public university system (Northwest)", tenure: 6.8 },
      { name: "Regional state library consortium", tenure: 0.9 },
    ].map(o => ({ ...o, status: 'discontinued' })),
    unknown: [
      { name: "Library services vendor", tenure: null, status: 'unknown' },
    ],
  },
  '2012': {
    maxYears: 14,
    scaleNote: 'Scale: 14 years (2012–2026)',
    axisTicks: [0, 2, 4, 6, 8, 10, 12, 14],
    active: [
      "Private philanthropic foundation",
      "National research library (International)",
      "Academic library services vendor",
      "Nonprofit academic publisher & aggregator",
      "Private R1 university (South)",
      "Public research university (Canada) A",
      "Public R1 university (Mountain West)",
    ].map(name => ({ name, tenure: 14, status: 'active' })),
    discontinued: [
      { name: "Public research university (Canada) B", tenure: 11.3 },
      { name: "Institutional repository platform vendor", tenure: 6.8 },
      { name: "Regional research network", tenure: 5.2 },
      { name: "Academic journal publisher", tenure: 5.1 },
      { name: "Library school consortium", tenure: 5.0 },
      { name: "Private teaching university (West)", tenure: 2.3 },
      { name: "For-profit online university", tenure: 2.2 },
    ].map(o => ({ ...o, status: 'discontinued' })),
    unknown: [
      { name: "Private R1 university (Midwest)", tenure: null, status: 'unknown' },
      { name: "Federal government research institute library", tenure: null, status: 'unknown' },
    ],
  },
  '2018': {
    maxYears: 8,
    scaleNote: 'Scale: 8 years (2018–2026)',
    axisTicks: [0, 1, 2, 3, 4, 5, 6, 7, 8],
    active: [
      { name: "Private R1 university (Northeast)", tenure: 8, status: 'active' },
      { name: "Public R1 university (Midwest)", tenure: 8, status: 'active' },
    ],
    discontinued: [
      { name: "Public research university (Canada)", tenure: 7.3 },
      { name: "Public Hispanic-Serving Institution (Southwest)", tenure: 7.1 },
      { name: "Private medical school (merged with larger university)", tenure: 6.6 },
      { name: "Public academic medical center (Midwest)", tenure: 6.0 },
      { name: "Private liberal arts college (Northeast) A", tenure: 2.5 },
      { name: "Public university (Caribbean)", tenure: 2.1 },
      { name: "Private liberal arts college (Northeast) B", tenure: 2.0 },
      { name: "Private R1 university (Mid-Atlantic)", tenure: 2.0 },
      { name: "Regional library consortium", tenure: 0.7 },
    ].map(o => ({ ...o, status: 'discontinued' })),
    unknown: [],
  }
};

function pct(val, max) { return (val / max) * 100; }

function buildBar(org, maxYears) {
  if (org.status === 'unknown') {
    return `<div class="seg-unknown" style="width:${pct(maxYears * 0.07, maxYears)}%;"></div>`;
  } else if (org.status === 'active') {
    return `<div class="seg-active" style="width:${pct(org.tenure, maxYears)}%;"></div>`;
  } else {
    const a = pct(org.tenure, maxYears);
    return `<div class="seg-active" style="width:${a}%;"></div><div class="seg-inactive" style="width:${100 - a}%;"></div>`;
  }
}

function buildChart(year) {
  const d = data[year];
  const all = [...d.active, ...d.discontinued, ...d.unknown];
  const totalActive = d.active.length;
  const totalDisc = d.discontinued.length;
  const totalUnknown = d.unknown.length;
  const total = all.length;

  let html = '';

  // Summary stats
  html += `<div class="cohort-summary">
    <div class="summary-stat">
      <span class="summary-num">${total}</span>
      <span class="summary-label">Organizations</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <span class="summary-num">${totalActive}</span>
      <span class="summary-label">Still active</span>
    </div>
    <div class="summary-divider"></div>
    <div class="summary-stat">
      <span class="summary-num">${totalDisc}</span>
      <span class="summary-label">Discontinued</span>
    </div>
    ${totalUnknown > 0 ? `<div class="summary-divider"></div>
    <div class="summary-stat">
      <span class="summary-num">${totalUnknown}</span>
      <span class="summary-label">Unknown</span>
    </div>` : ''}
  </div>`;

  // Axis
  html += `<div class="axis-row">`;
  d.axisTicks.forEach(y => {
    const left = pct(y, d.maxYears);
    html += `<span class="axis-tick" style="left:${left}%;">${y === 0 ? '0' : y + 'yr'}</span>`;
  });
  html += `<div class="axis-line"></div></div>`;

  // Active rows
  let delay = 0;
  d.active.forEach(org => {
    html += `<div class="org-row" style="animation-delay:${delay}ms;">
      <div class="org-name">${org.name}</div>
      <div class="bar-track">${buildBar(org, d.maxYears)}</div>
      <div class="tenure-label">${org.tenure} yrs</div>
    </div>`;
    delay += 30;
  });

  if (d.discontinued.length) {
    html += `<div class="section-divider" style="animation-delay:${delay}ms;"><span>Discontinued</span></div>`;
    delay += 30;
    d.discontinued.forEach(org => {
      html += `<div class="org-row" style="animation-delay:${delay}ms;">
        <div class="org-name">${org.name}</div>
        <div class="bar-track">${buildBar(org, d.maxYears)}</div>
        <div class="tenure-label">${org.tenure} yrs</div>
      </div>`;
      delay += 30;
    });
  }

  if (d.unknown.length) {
    html += `<div class="section-divider" style="animation-delay:${delay}ms;"><span>Tenure unknown</span></div>`;
    delay += 30;
    d.unknown.forEach(org => {
      html += `<div class="org-row" style="animation-delay:${delay}ms;">
        <div class="org-name">${org.name}</div>
        <div class="bar-track">${buildBar(org, d.maxYears)}</div>
        <div class="tenure-label">unknown</div>
      </div>`;
      delay += 30;
    });
  }

  // Legend
  html += `<div class="legend">
    <div class="legend-item"><span class="leg-swatch" style="background:#1D9E75;"></span>Active membership</div>
    <div class="legend-item"><span class="leg-swatch" style="background:#b4b2a9;"></span>Discontinued</div>
    <div class="legend-item"><span class="leg-swatch" style="background:#C0DD97;border:1.5px dashed #3B6D11;"></span>Tenure unknown</div>
  </div>`;

  html += `<p class="scale-note">${d.scaleNote}</p>`;

  return html;
}

function switchTab(year, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  const panel = document.getElementById(`panel-${year}`);
  panel.classList.add('active');
  const chart = document.getElementById(`chart-${year}`);
  chart.innerHTML = buildChart(year);
}

// Init all charts
document.getElementById('chart-1999').innerHTML = buildChart('1999');
document.getElementById('chart-2012').innerHTML = buildChart('2012');
document.getElementById('chart-2018').innerHTML = buildChart('2018');
</script>
</body>
</html>
